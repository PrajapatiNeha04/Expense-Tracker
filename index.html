<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sidebar">
    <h2>Expense Tracker</h2>
    <nav>
      <ul>
        <li><a href="#">Dashboard</a></li>
        <li><a href="#">Add Expense</a></li>
        <li><a href="#">Expense History</a></li>
        <li><a href="#">Summary</a></li>
      </ul>
    </nav>
  </div>

  <div class="main-content">
    <h1>Add New Expense</h1>
    <form id="expense-form">
      <label for="expense-name">Expense Name</label>
      <input type="text" id="expense-name" placeholder="Enter Expense Name" required>

      <label for="expense-category">Category</label>
      <select id="expense-category" required>
        <option value="Food">Food</option>
        <option value="Rent">Rent</option>
        <option value="Utilities">Utilities</option>
        <option value="Entertainment">Entertainment</option>
      </select>

      <label for="expense-amount">Amount</label>
      <input type="number" id="expense-amount" placeholder="Enter Amount" required>

      <button type="submit">Add Expense</button>
    </form>

    <div class="expense-history">
      <h2>Expense History</h2>
      <table id="expense-table">
        <thead>
          <tr>
            <th>Expense</th>
            <th>Category</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody id="expense-table-body">
          <!-- Expense rows will go here -->
        </tbody>
      </table>
    </div>

    <div class="expense-summary">
      <h3>Expense Summary</h3>
      <div class="summary-item">
        <span>Total Expenses</span>
        <span id="total-expense">$0.00</span>
      </div>
    </div>

    <div class="budget-overview">
      <h3>Budget Overview</h3>
      <div class="progress-bar low">
        <div class="progress-bar-inner" style="width: 40%;"></div>
      </div>
      <div class="progress-bar medium">
        <div class="progress-bar-inner" style="width: 60%;"></div>
      </div>
      <div class="progress-bar high">
        <div class="progress-bar-inner" style="width: 90%;"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
